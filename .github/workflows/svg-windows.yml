name: SVG Windows desktop

on:
  push:
    branches: [svg-desktop-windows]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAVOTTO_NO_TELEMETRY: "1"
  TAVOTTO_DISABLE_UPDATE_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  windows:
    if: github.repository == 'yuanyi5453-oss/Tavotto'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: 安装构建与检查依赖
        run: |
          python -m pip install pyinstaller pytest 'ruff>=0.16,<0.17' 'flask>=3.1,<4' 'pymupdf>=1.24,<2'
      - name: 检查 SVG 原图与画布实际输出
        env:
          PYTHONPATH: src
        run: |
          python -m ruff check scripts/smoke_desktop.py
          python -m ruff format --check scripts/smoke_desktop.py
          python -m pytest tests/test_export_request.py tests/test_export_pipeline.py -k 'svg or golden' -q
      - name: 构建前端、内置 Python、workerd 与 sidecar
        env:
          TAVOTTO_REQUIRE_RUNTIME: "1"
        run: python scripts/build_desktop.py --skip-tauri
      - name: 验证桌面认证链路与实际 SVG 导出
        run: python scripts/smoke_desktop.py --sidecar dist/Tavotto/Tavotto.exe
      - name: 验证包内科学环境和导出尺寸
        run: |
          python scripts/smoke_app.py --exe dist/Tavotto/Tavotto.exe \
            --figures examples/runtime_check --expect-source bundled --expect-runtime \
            --expect-control-plane workerd --expect-packages numpy,pandas,scipy,seaborn,PIL,matplotlib --tutorial
      - name: 构建个人版 Windows 安装包
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --bundles nsis --config src-tauri/tauri.svg.conf.json
      - name: 整理安装包与校验值
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter *.exe)
          if ($packages.Count -ne 1) { throw 'Expected exactly one installer' }
          New-Item -ItemType Directory -Path out | Out-Null
          $name = 'Tavotto-0.15.0-SVG-Windows-Setup.exe'
          Copy-Item -LiteralPath $packages[0].FullName -Destination (Join-Path out $name)
          $hash = (Get-FileHash -LiteralPath (Join-Path out $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath out/SHA256SUMS.txt -Encoding ascii
          Copy-Item -LiteralPath docs/svg-desktop-windows.md -Destination out/README.md
          Copy-Item -LiteralPath LICENSE -Destination out/LICENSE
          '${{ github.sha }}' | Set-Content -LiteralPath out/SOURCE_COMMIT.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tavotto-SVG-Windows
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Tavotto-SVG-Windows
          path: out
      - name: 发布通过检查的个人预发行包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="svg-desktop-${SOURCE_SHA:0:12}"
          gh release create "$tag" out/* --target "$SOURCE_SHA" --prerelease \
            --title "Tavotto 0.15.0 SVG Windows" --notes-file out/README.md
